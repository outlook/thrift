name: Build
on: [push]
jobs:
  Build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: brew install autoconf automake bison pkg-config boost libtool

      - name: Update PATH
        run: |
          echo "/opt/homebrew/opt/bison/bin" >> $GITHUB_PATH
          export LDFLAGS="-L/opt/homebrew/opt/bison/lib"
          whereis bison

      - name: Boostrap
        run: |
          whereis bison
          ./bootstrap.sh

      - name: Configure
        run: |
          export CFLAGS="-Wno-deprecated-copy-with-user-provided-copy"
          export CXXFLAGS="-Wno-deprecated-copy-with-user-provided-copy"
          whereis bison

          ./configure

      - name: Make
        run: |
          export CFLAGS="-Wno-deprecated-copy-with-user-provided-copy"
          export CXXFLAGS="-Wno-deprecated-copy-with-user-provided-copy"
          whereis bison

          cd ./compiler/cpp
          make

      - name: Add executable permission
        run: chmod +x ./compiler/cpp/thrift

      - name: 'Zip files'
        run: zip -j ./thrift.zip ./compiler/cpp/thrift

      - name: 'Upload Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: thrift.zip
          path: ./thrift.zip
