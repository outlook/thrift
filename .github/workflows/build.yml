name: Build
on: [push]
jobs:
  Build:
    runs-on: macos-15-intel  # Uses x86_64 (Intel) runners - newer supported version
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: brew install autoconf automake bison pkg-config boost libtool

      - name: Update environment variables
        run: |
          echo "/usr/local/opt/bison/bin" >> $GITHUB_PATH
          export LDFLAGS="-L/usr/local/opt/bison/lib"
          export CFLAGS="-Wno-deprecated-copy-with-user-provided-copy -arch x86_64"
          export CXXFLAGS="-Wno-deprecated-copy-with-user-provided-copy -arch x86_64"
          export LDFLAGS="$LDFLAGS -arch x86_64"

      - name: Boostrap
        run: ./bootstrap.sh

      - name: Configure
        run: ./configure

      - name: Make
        run: |
          cd ./compiler/cpp
          make

      - name: Add executable permission
        run: chmod +x ./compiler/cpp/thrift

      - name: 'Zip files'
        run: zip -j ./thrift.zip ./compiler/cpp/thrift

      - name: 'Upload Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: thrift.zip
          path: ./thrift.zip
