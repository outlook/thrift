name: Build
on: [push]
jobs:
  Build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: brew install autoconf automake bison pkg-config boost@1.76

      - name: Boostrap
        run: |
          export PATH="/usr/local/opt/bison/bin:$PATH"
          ./bootstrap.sh

      - name: Configure
        run: |
          export PATH="/usr/local/opt/bison/bin:$PATH"
          ./configure

      - name: Make
        run: |
          export PATH="/usr/local/opt/bison/bin:$PATH"
          make

      - uses: actions/upload-artifact@v3
        with:
          name: thrift
          path: ./thrift
