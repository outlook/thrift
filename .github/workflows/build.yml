name: Build
on: [push]
jobs:
  Build:
    runs-on: macos-12
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: brew install autoconf automake bison pkg-config boost

      - name: Boostrap
        run: |
          export PATH="/usr/local/opt/bison/bin:$PATH"

          ./bootstrap.sh

      - name: Configure
        run: |
          export PATH="/usr/local/opt/bison/bin:$PATH"

          export CFLAGS="-Wdeprecated-copy"
          export CXXFLAGS="-Wdeprecated-copy"

          ./configure

      - name: Make
        run: |
          export PATH="/usr/local/opt/bison/bin:$PATH"

          export CFLAGS="-Wdeprecated-copy"
          export CXXFLAGS="-Wdeprecated-copy"

          cd compiler/cpp
          make

      - uses: actions/upload-artifact@v3
        with:
          name: thrift
          path: ./thrift
